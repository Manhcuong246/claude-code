# Run from repo root:
#   cp deploy/aws.env.example deploy/aws.env
#   # Edit deploy/aws.env — set API keys, ANTHROPIC_AUTH_TOKEN, MODEL, etc.
#   docker compose -f deploy/docker-compose.yml up -d
#
# Logs and admin-managed config live on volume fcc-data ($HOME in the container).

services:
  proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - aws.env
    environment:
      HOME: /data
    ports:
      - "${PUBLIC_PORT:-8082}:8082"
    volumes:
      - fcc-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  fcc-data:
